<!-- tardigrade-runner mark, filled version - Copyright 2026 zbrdc - Apache-2.0
     The same croissant-backed tardigrade as assets/logo.svg, drawn solid.
     The white seams across the back read as the croissant's flake layers
     and as the tardigrade's segments at once; the head is at the left,
     with the four stubby legs and their claws below.
     This is the small-size mark: scaled to 16 px it still holds 31% dark
     pixels, where the outline version holds none.
     Traced from the generated artwork and simplified to 181 points.
     To follow the surrounding text colour instead of the brand navy,
     delete the color attribute on the root element. -->
