<!-- tardigrade-runner mark, outline version - Copyright 2026 zbrdc - Apache-2.0
     A tardigrade whose humped, layered back curls like a croissant. Bold
     uniform-width outline, flat single ink colour, no fill, no gradient,
     no lettering, no ornament.
     Use this one at large sizes. Below roughly 24 px the strokes blur out
     and it stops being legible; assets/icon.svg is the filled twin that
     survives those sizes.
     Traced from the generated artwork and simplified to 399 points, so the
     strokes are closed filled shapes, not an editable stroke width.
     To follow the surrounding text colour instead of the brand navy,
     delete the color attribute on the root element. -->
