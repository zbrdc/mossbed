<!-- tardigrade-runner mark - Copyright 2026 zbrdc - Apache-2.0
     Monochrome, icon-only: one ink colour, no lettering, no gradient,
     no ornament. The body is a container; the band across it is the lid
     seam and, on close inspection, a cage slot. All internal detail is
     negative space, so no background colour is baked in and the silhouette
     still reads once the detail vanishes at favicon size.
