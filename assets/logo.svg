<!-- mossbed mark - Copyright 2026 zbrdc - Apache-2.0
     A tardigrade whose humped, layered back curls like a croissant: the
     flake layers of the pastry and the segments of the animal are the same
     curves. Bold uniform-width outline, flat single ink colour, no fill,
     no gradient, no lettering, no ornament.

     Two structural rules to keep when editing this file:
     - Every contour is a subpath of ONE path element. Split across several
       paths, fill-rule evenodd fills the holes instead of cancelling them,
       because the rule only applies within a single path element.
     - The fill is a literal colour, not currentColor. Renderers other than
       browsers (ImageMagick among them) paint currentColor as nothing at
       all. To follow the surrounding text colour instead, swap
       fill="#182749" for fill="currentColor" and set color on the root.

     Use at large sizes: below roughly 24 px the strokes blur out and the
     mark stops being legible. Traced from generated artwork, so its strokes
     are closed shapes and its line weight is a shape width, not an editable
     stroke-width. -->
